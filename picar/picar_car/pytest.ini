# pytest settings for picar_car's tests: python3 -m pytest test
[pytest]
# ROS's launch_testing pytest plugin turns test_ultrasonic.py's skip (no gpiozero, as in WSL)
# into "no tests collected" for the whole folder, hiding test_hw_backend.py. These tests
# don't use it, so it is turned off here (with launch_ros, which needs it).
addopts = -p no:launch_testing -p no:launch_ros
