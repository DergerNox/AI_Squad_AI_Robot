# Settings for the real PiCar-B, one section per node (started by car.launch.py).
# The twin's values are in picar_base/config/sim.yaml. Measure them again on the car.

camera:                      # camera_ros
  ros__parameters:
    format: RGB888           # arrives as bgr8, which the agent reads (the default can be 4-channel)
    width: 640               # the same picture size as the twin
    height: 480
    FrameDurationLimits: [100000, 100000]   # 10 pictures a second, like the twin (microseconds each)
    # Without sensor_mode, libcamera may crop the sensor to make 640x480: a narrow,
    # zoomed-in view. A full-picture mode scaled down keeps the whole view: "1296:972"
    # for the OV5647 camera (Camera Module 1), "1640:1232" for the IMX219 (Module 2).
    # The camera node prints the available modes when it starts.
    # sensor_mode: "1296:972"
    # orientation: 180       # if the picture is upside down

ultrasonic:                  # picar_car's distance sensor node (HC-SR04)
  ros__parameters:
    trigger_pin: 11          # BCM GPIO numbers, Adeept's wiring (their server/ultra.py)
    echo_pin: 8
    rate_hz: 10.0            # picar_base stops the car if no reading arrives for 0.3 s
    max_range_m: 4.0

picar_base:
  ros__parameters:
    backend: hw              # picar_car.hw_backend: Adeept's board (motors on GPIO, servos on a PCA9685)
    range_topics: ["/ultrasonic/range"]   # the distance sensors that guard the way ahead
    wheelbase_m: 0.145       # measure on the car
    full_speed_mps: 0.5      # measure: speed at full motor power
    max_steering_deg: 30.0
    max_speed: 0.6           # fraction of full motor power: with hw.min_duty_percent 0 the PWM duty
                             # (0.4 = 11 cm/s was too slow, 2026-11-17; 74 % duty drove 0.56 m/s)
    max_move_s: 3.0
    cmd_timeout_s: 0.5
    obstacle_stop_m: 0.25
    range_timeout_s: 0.3
    # the head's servo limits (hw.pan_limits) are about 60 left, 50 right, but at -50 (420 steps) the
    # pan servo pushed against its end and strained (2026-11-24): the tools stay within 40
    max_pan_deg: 40.0
    max_tilt_deg: 40.0
    # The hw backend (picar_car/hw_backend.py). The values are the team's, from
    # picar_control/motor_steering_node.py, which drives this car. Decimals stay decimals.
    # Servo values are PCA9685 steps (1/4096 of 20 ms; 300 is about 1.5 ms): lower values
    # turn the steering and the camera left, and tilt the camera up.
    hw:
      motor_a_pins: [4, 14, 15]      # BCM: enable (PWM), forward, backward
      motor_b_pins: [17, 27, 18]
      motor_pwm_hz: 1000
      # power 0..1 -> min..100 % duty. The team's 60 made slow driving impossible: with fresh
      # batteries 1 s at 74 % drove 0.56 m (2026-11-17). 0: power = duty (max_speed 0.6 = 60 %).
      min_duty_percent: 0.0
      i2c_bus: 1
      pca9685_address: 64            # 0x40
      steering_channel: 2
      # Straight ahead. The team's 300 pulled right (about 35 deg per metre, 2026-11-20); measured
      # with 1 s drives: 291 about 3 deg right per 0.2 m, 285 about 2, 281 about 1.5
      steering_centre: 281
      steering_full_left: 242        # at +max_steering_deg
      # at -max_steering_deg. 50 steps right of the centre, as the team had it (300 + 50): with the
      # centre at 281, 350 pushed the wheels against their end and right turns hardly moved (2026-11-24)
      steering_full_right: 331
      pan_channel: 6
      pan_centre: 311
      pan_per_deg: 2.2               # measure: steps per degree (negative turns the other way)
      pan_limits: [180, 420]         # the team's safe range: about 60 deg left, 50 deg right
      tilt_channel: 10
      tilt_centre: 340
      tilt_per_deg: 2.2
      tilt_limits: [180, 430]        # about 70 deg up, 40 deg down
      watchdog_s: 0.5                # no drive command for this long: the motors stop

# What the AI knows about the car. The agent reads this file with PICAR_CONFIG=car (in its
# .env on the Pi), plus picar_base's speed, limits and stop distance above. No ROS node uses
# this section, but ROS reads the file: lists must be flat, all whole numbers or all decimals.
# These are the twin's values: measure them on the car.
picar_agent:
  ros__parameters:
    description: "an Adeept PiCar-B, a real car in a real room"   # what the AI is told it drives
    # JPEGs from camera_ros (compressed-image-transport): about 9 Mbit/s over Wi-Fi instead
    # of 74 for raw pictures. The twin leaves this out: raw /camera/image_raw.
    camera_topic: "/camera/image_raw/compressed"
    # Motor power the agent drives with, a fraction of full power (at most picar_base's
    # max_speed; the twin leaves these out and drives at max_speed both ways), and the speeds
    # measured at those powers (the twin's are full_speed_mps x power). With hw.min_duty_percent
    # 0 power = PWM duty. Measured 2026-11-17 (fresh batteries, 1 s each, distance sensor at a
    # wall): forward 20 % 0.7 cm, 30 % 8.7 cm, 35 % 21.8 and 6.0 cm (unsteady, near the stall),
    # 40 % 11.3 cm, 50 % 21.7 cm, 60 % 32.4 cm; reverse 15 % 0.8 cm, 20 % 0.3 cm, 30 % 2.4 cm,
    # 40 % 6.2 and 7.8 cm, 50 % 16.3 cm, 60 % 21.1 cm. Ferenc chose "a bit faster" than 40 %.
    forward_power: 0.5
    reverse_power: 0.5
    # The motors need about 0.35 s to get the car rolling: straight at 0.5, 0.2 s moved it 4 mm,
    # 0.3 s 1.5 cm, 0.5 s 5 cm, 0.7 s 4-11 cm, 1.0 s 11-31 cm (sensor at a bed and a basket,
    # 2026-11-24). So every move is start_lag_s longer, and the speeds are after the start-up
    # (the 1 s measurements of 2026-11-17 above were 0.22 / 0.16 m/s including it).
    start_lag_s: 0.35
    forward_speed_mps: 0.28
    reverse_speed_mps: 0.25
    # Turns (three quarters of full steering or more) drive at their own power: at full lock the
    # wheels barely roll at 0.5 (1 s: 3 cm, 5 deg). At 0.6, 1.5 s turned about 30-40 deg and rolled
    # about 0.15-0.2 m (left; right the same once steering_full_right was 331), 2026-11-24.
    turn_power: 0.6
    turn_speed_mps: 0.15       # after the start-up: full left lock 0.4 s turned ~2 deg, 0.7 s ~7-10 deg
    # approach looks again after at most this far: a 0.6 m step lost the white bed when the car
    # pulled to one side (2026-11-20). The twin leaves it out: its longest drive.
    approach_step_m: 0.3
    length_m: 0.22
    width_m: 0.10
    turn_deg_per_m: 200.0     # measure: heading change per metre at full steering
    head_deg_per_s: 150.0     # measure: how fast the camera head turns
    camera_height_m: 0.17
    # How wide the picture is: the OV5647 (Camera Module 1) sees 53.5 degrees across its whole
    # sensor, and camera_ros's 640x480 uses 2560 of its 2592 pixels (read from the sensor while
    # streaming, 2026-11-24): about 53 degrees. The twin's camera is 62.
    camera_fov_deg: 53.0
    # With tilt 0: how far down the picture an object touches the floor (0.5 = the middle
    # row, 1.0 = the bottom edge), and how far from the bumper it is then. Measure on the car.
    # Measured 2026-11-24 with a basket on the floor, from the distance sensor and the model's box:
    # rows 0.65-0.93 for 1.16-0.45 m, fitted by d = 0.329 / (row - 0.400) - 0.165 within 2 cm;
    # the rows 1.0, 0.95 and 0.6 are from the fit. (A bag at row 0.7 read 0.63 m: a soft bag.)
    floor_measured: true
    floor_rows: [1.0, 0.95, 0.9, 0.85, 0.8, 0.75, 0.7, 0.65, 0.6]
    floor_distances_m: [0.38, 0.43, 0.49, 0.57, 0.66, 0.78, 0.93, 1.15, 1.48]
    own_parts: "its wheels and parts of its body"   # say what colour they are on the real car
