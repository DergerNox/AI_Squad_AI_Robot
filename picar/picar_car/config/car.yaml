# Settings for the real PiCar-B, one section per node (started by car.launch.py).
# The twin's values are in picar_base/config/sim.yaml. Measure them again on the car.

camera:                      # camera_ros
  ros__parameters:
    format: RGB888           # arrives as bgr8, which the agent reads (the default can be 4-channel)
    width: 640               # the same picture size as the twin
    height: 480
    FrameDurationLimits: [100000, 100000]   # 10 pictures a second, like the twin (microseconds each)
    # Without sensor_mode, libcamera may crop the sensor to make 640x480: a narrow,
    # zoomed-in view. A full-picture mode scaled down keeps the whole view: "1296:972"
    # for the OV5647 camera (Camera Module 1), "1640:1232" for the IMX219 (Module 2).
    # The camera node prints the available modes when it starts.
    # sensor_mode: "1296:972"
    # orientation: 180       # if the picture is upside down

ultrasonic:                  # picar_car's distance sensor node (HC-SR04)
  ros__parameters:
    trigger_pin: 11          # BCM GPIO numbers, Adeept's wiring (their server/ultra.py)
    echo_pin: 8
    rate_hz: 10.0            # picar_base stops the car if no reading arrives for 0.3 s
    max_range_m: 4.0

picar_base:
  ros__parameters:
    backend: hw              # picar_car.hw_backend: Adeept's board (motors on GPIO, servos on a PCA9685)
    range_topics: ["/ultrasonic/range"]   # the distance sensors that guard the way ahead
    wheelbase_m: 0.145       # measure on the car
    full_speed_mps: 0.5      # measure: speed at full motor power
    max_steering_deg: 30.0
    max_speed: 0.4           # fraction of full motor power
    max_move_s: 3.0
    cmd_timeout_s: 0.5
    obstacle_stop_m: 0.25
    range_timeout_s: 0.3
    max_pan_deg: 90.0
    max_tilt_deg: 40.0
    # The hw backend (picar_car/hw_backend.py). The values are the team's, from
    # picar_control/motor_steering_node.py, which drives this car. Decimals stay decimals.
    # Servo values are PCA9685 steps (1/4096 of 20 ms; 300 is about 1.5 ms): lower values
    # turn the steering and the camera left, and tilt the camera up.
    hw:
      motor_a_pins: [4, 14, 15]      # BCM: enable (PWM), forward, backward
      motor_b_pins: [17, 27, 18]
      motor_pwm_hz: 1000
      min_duty_percent: 60.0         # the motors do not turn below this: power 0..1 -> 60..100 %
      i2c_bus: 1
      pca9685_address: 64            # 0x40
      steering_channel: 2
      steering_centre: 300
      steering_full_left: 242        # at +max_steering_deg
      steering_full_right: 350       # at -max_steering_deg
      pan_channel: 6
      pan_centre: 311
      pan_per_deg: 2.2               # measure: steps per degree (negative turns the other way)
      pan_limits: [180, 420]         # the team's safe range: about 60 deg left, 50 deg right
      tilt_channel: 10
      tilt_centre: 340
      tilt_per_deg: 2.2
      tilt_limits: [180, 430]        # about 70 deg up, 40 deg down
      watchdog_s: 0.5                # no drive command for this long: the motors stop

# What the AI knows about the car. The agent reads this file with PICAR_CONFIG=car (in its
# .env on the Pi), plus picar_base's speed, limits and stop distance above. No ROS node uses
# this section, but ROS reads the file: lists must be flat, all whole numbers or all decimals.
# These are the twin's values: measure them on the car.
picar_agent:
  ros__parameters:
    description: "an Adeept PiCar-B, a real car in a real room"   # what the AI is told it drives
    length_m: 0.22
    width_m: 0.10
    turn_deg_per_m: 200.0     # measure: heading change per metre at full steering
    head_deg_per_s: 150.0     # measure: how fast the camera head turns
    camera_height_m: 0.17
    camera_fov_deg: 62.0      # measure: how wide the picture is
    # With tilt 0: how far down the picture an object touches the floor (0.5 = the middle
    # row, 1.0 = the bottom edge), and how far from the bumper it is then. Measure on the car.
    floor_rows: [1.0, 0.9, 0.8, 0.75, 0.7, 0.65, 0.6]
    floor_distances_m: [0.35, 0.45, 0.6, 0.75, 0.9, 1.25, 1.9]
    own_parts: "its wheels and parts of its body"   # say what colour they are on the real car
