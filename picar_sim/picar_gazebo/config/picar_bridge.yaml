# ros_gz_bridge topics for the PiCar-B twin.
# Gazebo-side names match the <topic> settings in picar.urdf.xacro.

# Simulation time
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Drive: Twist (linear.x m/s, angular.z rad/s) -> Ackermann controller
- ros_topic_name: "/sim/cmd_vel"
  gz_topic_name: "/sim/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Head servos: target angle in radians (pan + = left, tilt + = up)
- ros_topic_name: "/sim/head_pan"
  gz_topic_name: "/sim/head_pan"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/sim/head_tilt"
  gz_topic_name: "/sim/head_tilt"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

# Camera
- ros_topic_name: "/camera/image_raw"
  gz_topic_name: "/camera/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/camera_info"
  gz_topic_name: "/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# Ultrasonic: the bridge converts the lidar fan to a Range with the shortest ray
- ros_topic_name: "/ultrasonic/range"
  gz_topic_name: "/ultrasonic/range"
  ros_type_name: "sensor_msgs/msg/Range"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Joint angles (wheels, steering, head) for robot_state_publisher
- ros_topic_name: "/joint_states"
  gz_topic_name: "/sim/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# Wheel odometry and the odom -> base_footprint transform
- ros_topic_name: "/sim/odom"
  gz_topic_name: "/sim/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/tf"
  gz_topic_name: "/sim/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS
