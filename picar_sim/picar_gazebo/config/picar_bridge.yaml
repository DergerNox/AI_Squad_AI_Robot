# ros_gz_bridge topics for the twin's simulated car hardware (node sim_bridge):
# the motors, the servos, the wheel odometry and the clock. picar_base drives these
# in the twin; on the real car it drives the hardware directly instead.
# The camera and the distance sensor have their own bridge nodes, like on the real
# car: see camera_bridge.yaml and ultrasonic_bridge.yaml.
# Gazebo-side names match the <topic> settings in picar.urdf.xacro.

# Simulation time
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Drive: Twist (linear.x m/s, angular.z rad/s) -> Ackermann controller
- ros_topic_name: "/sim/cmd_vel"
  gz_topic_name: "/sim/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Head servos: target angle in radians (pan + = left, tilt + = up)
- ros_topic_name: "/sim/head_pan"
  gz_topic_name: "/sim/head_pan"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/sim/head_tilt"
  gz_topic_name: "/sim/head_tilt"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

# Joint angles (wheels, steering, head) for robot_state_publisher
- ros_topic_name: "/joint_states"
  gz_topic_name: "/sim/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# Wheel odometry and the odom -> base_footprint transform
- ros_topic_name: "/sim/odom"
  gz_topic_name: "/sim/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/tf"
  gz_topic_name: "/sim/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS
