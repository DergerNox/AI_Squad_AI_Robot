# Settings for the Gazebo twin, one section per node. The real car's are in
# picar_car/config/car.yaml. The agent reads this file too (PICAR_CONFIG=sim, the default):
# the speed, the limits and the stop distance from picar_base, the rest from picar_agent.
picar_base:
  ros__parameters:
    backend: sim
    wheelbase_m: 0.145        # same as wheel_base in picar.urdf.xacro
    full_speed_mps: 0.5       # twin speed at full motor power (the connector maps 0.5 m/s the same way)
    max_steering_deg: 30.0
    max_speed: 0.4            # fraction of full motor power
    max_move_s: 3.0
    cmd_timeout_s: 0.5
    obstacle_stop_m: 0.25
    range_timeout_s: 0.3
    max_pan_deg: 90.0
    max_tilt_deg: 40.0

# What the AI knows about the car (shared/picar_agent reads it; no ROS node uses it).
# ROS reads this file too: lists must be flat, and all whole numbers or all decimals.
picar_agent:
  ros__parameters:
    description: "a simulated Adeept PiCar-B in a room in Gazebo"   # what the AI is told it drives
    length_m: 0.22
    width_m: 0.10
    turn_deg_per_m: 200.0     # heading change per metre at full steering (measured in the twin)
    head_deg_per_s: 150.0     # how fast the camera head turns (measured in the twin)
    camera_height_m: 0.17
    camera_fov_deg: 62.0      # how wide the picture is
    # With tilt 0: how far down the picture an object touches the floor (0.5 = the middle
    # row, 1.0 = the bottom edge), and how far from the bumper it is then
    floor_rows: [1.0, 0.9, 0.8, 0.75, 0.7, 0.65, 0.6]
    floor_distances_m: [0.35, 0.45, 0.6, 0.75, 0.9, 1.25, 1.9]
    own_parts: "black wheels, green body"   # what the camera may see of the car itself
