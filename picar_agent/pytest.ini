# pytest settings for the agent's tests: python3 -m pytest test
[pytest]
# test/twin holds scripts for the running twin, not pytest tests: they start ROS as soon as
# they are imported (see test/twin/README.md), so pytest must not look in there.
# ROS's launch_testing pytest plugin stops pytest from skipping any folder, and these tests
# don't use it, so it is turned off here (with launch_ros, which needs it).
addopts = -p no:launch_testing -p no:launch_ros
norecursedirs = twin .* *.egg _darcs build CVS dist node_modules venv {arch}
